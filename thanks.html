<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You’re in — MicroBreaks founder unlock</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <script defer data-domain="microbreaks.co" src="https://plausible.jasperschoormans.nl/js/script.js"></script>
  <script>
    window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments); };
    window.plausible('founder_unlock_thanks');
  </script>

  <style>
    :root {
      --bg: #f4f6f5;
      --card: #ffffff;
      --ink: #1a2332;
      --ink-muted: #5c6b7a;
      --border: #e4e9ec;
      --accent: #0d9488;
      --accent-soft: #ecfdf8;
      --shadow: 0 4px 24px rgba(26, 35, 50, 0.06), 0 1px 3px rgba(26, 35, 50, 0.04);
      --radius: 16px;
      --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 28px;
      text-align: center;
    }

    .check {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"></polyline></svg>
    </div>
    <h1>You’re in — early iOS access is locked.</h1>
    <p>Check your email for the receipt. Web timer stays free meanwhile.</p>
  </div>
</body>
</html>
